name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run compile
      - run: npm test --if-present
      - run: npm run build
      - run: npm run build:firefox

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run zip
      - run: npm run zip:firefox
      - uses: actions/upload-artifact@v4
        with:
          name: store-zips-${{ github.ref_name }}
          path: .output/*.zip
          if-no-files-found: error
          # .output est un dossier caché : exclu par défaut par upload-artifact v4
          include-hidden-files: true
