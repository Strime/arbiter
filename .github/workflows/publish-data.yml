# Publication OTA de la brand DB (docs/brands-db-ota-updates.md, étape C).
#
# Le code est privé : la publication part vers le repo PUBLIC dédié
# Strime/arbiter-data (branche gh-pages), qui sert aussi PRIVACY.html.
#   https://strime.github.io/arbiter-data/data/brands-manifest.json
#   https://strime.github.io/arbiter-data/data/brands.json
#   https://strime.github.io/arbiter-data/PRIVACY.html
# Auth : deploy key en écriture sur arbiter-data, stockée dans le secret
# ACTIONS_DEPLOY_KEY de ce repo.
# Note : le CDN de Pages sert `max-age=600` → jusqu'à ~10 min de propagation.
#
# Déploiement CI-only : pas de push manuel sur gh-pages (c'est la barrière
# d'intégrité réelle, le sha256 du manifest ne couvre que le transit).
name: Publish data

on:
  push:
    branches: [main]
    paths:
      - 'scripts/sources/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:brands
      # Gate de non-régression : échec (exit 1) si couverture < 95 %
      # ou précision pays < 98 % sur les cas certains de ground-truth.json.
      - run: npm run eval:brands -- --gate
      - run: node scripts/publish/make-data-manifest.mjs
      - uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.ACTIONS_DEPLOY_KEY }}
          external_repository: Strime/arbiter-data
          publish_branch: gh-pages
          publish_dir: ./.output/data-publish
          keep_files: false
          # Sans ça l'action pose un .nojekyll : les .md ne seraient jamais
          # convertis et /PRIVACY.html (URL exigée par le CWS) n'existerait pas.
          enable_jekyll: true
