<!doctype html>
<!-- Source de landing/assets/og-image.png — rendu navigateur (texte net),
     capturé en 1200×630. Régénération : voir scripts/generate-og-image.sh -->
<html lang="fr">
<meta charset="utf-8">
<style>
  * {
    margin: 0;
    box-sizing: border-box;
  }

  html,
  body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
  }

  body {
    position: relative;
    background: #fff;
    font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif;
  }

  .roundel {
    position: absolute;
    left: 78px;
    top: 130px;
    width: 370px;
    height: 370px;
  }

  .col {
    position: absolute;
    left: 470px;
    top: 118px;
    width: 660px;
  }

  h1 {
    font-size: 96px;
    font-weight: 800;
    letter-spacing: -0.015em;
    color: #14181D;
    line-height: 1.1;
  }

  p {
    margin-top: 18px;
    font-size: 40px;
    line-height: 1.34;
    color: #4A5560;
  }

  .pills {
    margin-top: 30px;
    display: flex;
    gap: 18px;
  }

  .pill {
    height: 48px;
    padding: 0 24px;
    border-radius: 24px;
    display: flex;
    align-items: center;
    font-size: 27px;
    font-weight: 700;
    color: #fff;
  }

  .pill--fr {
    background: #1e40af;
  }

  .pill--eu {
    background: #0369a1;
  }

  .pill--us {
    background: #b91c1c;
  }

  .pill--more {
    background: #e9edf2;
    color: #4a5560;
    letter-spacing: 0.08em;
  }

  .bar {
    position: absolute;
    bottom: 0;
    height: 14px;
  }

  .bar--blue {
    left: 0;
    width: 390px;
    background: #0055A4;
  }

  .bar--red {
    right: 0;
    width: 390px;
    background: #EF4135;
  }
</style>

<body>
  <svg class="roundel" viewBox="0 0 128 128" aria-hidden="true">
    <circle cx="40" cy="30" r="13" fill="#EF4135" />
    <circle cx="64" cy="19" r="16" fill="#EF4135" />
    <circle cx="88" cy="30" r="13" fill="#EF4135" />
    <circle cx="64" cy="76" r="50" fill="#EF4135" />
    <circle cx="64" cy="76" r="31" fill="#fff" />
    <circle cx="64" cy="76" r="15.5" fill="#0055A4" />
  </svg>
  <div class="col">
    <h1>Coquade</h1>
    <p>L'origine de vos produits — marque et fabrication — directement sur votre drive.</p>
    <div class="pills">
      <span class="pill pill--fr">FR</span>
      <span class="pill pill--us">US</span>
      <span class="pill pill--eu">ES</span>
      <span class="pill pill--more">…</span>
    </div>
  </div>
  <div class="bar bar--blue"></div>
  <div class="bar bar--red"></div>
</body>

</html>
